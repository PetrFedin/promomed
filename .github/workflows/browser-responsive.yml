name: Promomed responsive browser QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start Promomed server
        run: |
          SQLITE_PATH=/tmp/promomed-browser-qa.db PORT=10000 python server.py >/tmp/promomed-server.log 2>&1 &
          echo $! > /tmp/promomed-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/promomed-server.log
          exit 1
      - name: Test iPhone, tablet and desktop journeys
        env:
          PROMOMED_BASE_URL: http://127.0.0.1:10000
          PROMOMED_SCREENSHOT_DIR: artifacts/browser-qa
        run: |
          python tests/test_browser_responsive.py
          python tests/test_command_center_browser.py
          python tests/test_pilot_proposal_browser.py
          python tests/test_buyer_fit_browser.py
          python tests/test_evidence_export_browser.py
          python tests/test_institutional_presentation_browser.py
          python tests/test_outreach_pack_browser.py
          python tests/test_commercial_workspace_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promomed-browser-qa
          path: artifacts/browser-qa
          if-no-files-found: ignore
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/promomed-server.log
