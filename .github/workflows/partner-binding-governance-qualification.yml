name: Promomed partner binding governance qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/p0-partner-binding-governance-2026-10-24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-binding-governance:
    runs-on: ubuntu-latest
    env:
      SQLITE_PATH: /tmp/promomed-binding-governance-ci.sqlite
      DATABASE_URL: ""
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_REQUIRE_POSTGRES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Qualify two-actor authority and owner continuity on SQLite
        run: python -m unittest -v tests/test_partner_binding_governance.py tests/test_institution_registration_boundary.py

  postgres17-binding-governance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promomed
          POSTGRES_PASSWORD: promomed
          POSTGRES_DB: promomed_binding_governance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promomed -d promomed_binding_governance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_binding_governance_ci
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_REQUIRE_POSTGRES: "true"
      PROMOMED_BINDING_GOV_PG_TEST: "1"
      PROMOMED_ORG_ROUTE_PG_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Qualify concurrent independent governance on PostgreSQL 17
        run: python -m unittest -v tests/test_partner_binding_governance_postgres.py tests/test_institution_registration_postgres.py
