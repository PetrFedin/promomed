name: Promomed participant registration qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/p0-participant-registration-atomicity-2026-10-20
      - fix/p0-partner-binding-revocation-2026-10-20
      - fix/p0-commercial-write-atomicity-2026-10-20

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-registration:
    runs-on: ubuntu-latest
    env:
      SQLITE_PATH: /tmp/promomed-registration.db
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_REQUIRE_POSTGRES: "false"
      PROMOMED_REGISTRATION_CODE_SECRET: ci-registration-secret-value
      PROMOMED_REGISTRATION_SMTP_HOST: smtp.example.test
      PROMOMED_REGISTRATION_FROM_EMAIL: noreply@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Verify participant self-registration on SQLite
        run: python -m unittest -v tests/test_self_registration.py

  postgres-registration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promomed
          POSTGRES_PASSWORD: promomed
          POSTGRES_DB: promomed_registration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promomed -d promomed_registration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_registration_ci
      PROMOMED_REQUIRE_POSTGRES: "true"
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_REGISTRATION_CODE_SECRET: ci-registration-secret-value
      PROMOMED_REGISTRATION_SMTP_HOST: smtp.example.test
      PROMOMED_REGISTRATION_FROM_EMAIL: noreply@example.test
      PROMOMED_REGISTRATION_PG_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Verify participant registration on PostgreSQL 17
        run: python -m unittest -v tests/test_self_registration_postgres.py
