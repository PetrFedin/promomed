name: Promomed participant agenda qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/participant-unified-agenda-2026-10-20

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-agenda:
    runs-on: ubuntu-latest
    env:
      SQLITE_PATH: /tmp/promomed-agenda-sqlite.db
      DATABASE_URL: ""
      PROMOMED_REQUIRE_POSTGRES: "false"
      PROMOMED_SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Check Python contract and participant calendar UI
        run: python -m unittest -v tests/test_participant_agenda.py tests/test_my_state_ui_contract.py
      - name: Check memory-only personal workspace JavaScript
        run: node --check public/personal/workspace.js

  postgres-agenda:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promomed
          POSTGRES_PASSWORD: promomed
          POSTGRES_DB: promomed_agenda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promomed -d promomed_agenda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_agenda_ci
      PROMOMED_REQUIRE_POSTGRES: "true"
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_AGENDA_PG_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Qualify tenant and binding boundaries on PostgreSQL 17
        run: python -m unittest -v tests/test_participant_agenda_postgres.py
