name: Promomed live Render proof

on:
  push:
    branches:
      - main
    paths:
      - "server.py"
      - "app/**"
      - "public/**"
      - "migrations/**"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/live-render-proof.yml"

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Wait for exact main SHA on Render
        env:
          EXPECTED_SHA: ${{ github.sha }}
          LIVE_URL: https://sostoyanie-promomed-live.onrender.com
        run: |
          python - <<'PY'
          import json, os, subprocess, time, sys
          expected=os.environ["EXPECTED_SHA"]
          base=os.environ["LIVE_URL"].rstrip("/")
          last=""
          # Public Git services require an explicit Render API deploy; allow up to 10 minutes for that handoff.
          for attempt in range(1, 61):
              try:
                  p=subprocess.run(
                      ["curl","-fsS","--max-time","20",base+"/health"],
                      capture_output=True,text=True,timeout=25
                  )
                  if p.returncode==0:
                      last=p.stdout.strip()
                      data=json.loads(last)
                      live=data.get("git_commit")
                      print(f"attempt={attempt} live={live} expected={expected}")
                      if live==expected:
                          page=subprocess.run(
                              ["curl","-fsS","--max-time","20",base+"/"],
                              capture_output=True,text=True,timeout=25,check=True
                          ).stdout
                          required=[
                              "<b>⌂</b>Главная",
                              'id="accountInbox"',
                              'id="goldenDemoLauncher"',
                              "Написать организатору",
                          ]
                          missing=[x for x in required if x not in page]
                          if missing:
                              raise SystemExit("Live SHA matched but UI markers are missing: "+repr(missing))
                          ready_raw=subprocess.run(
                              ["curl","-fsS","--max-time","20",base+"/ready"],
                              capture_output=True,text=True,timeout=25
                          )
                          ready=json.loads(ready_raw.stdout or "{}")
                          backend=data.get("backend")
                          if backend=="sqlite":
                              if ready.get("production_ready") is not False:
                                  raise SystemExit("SQLite demo must never report production_ready=true: "+repr(ready))
                              if ready.get("durable") is not False:
                                  raise SystemExit("SQLite demo must report durable=false: "+repr(ready))
                              print("LIVE DEMO PROOF PASS: exact SHA, responsive UI, production_ready=false")
                          elif backend=="postgres":
                              required_ready={
                                  "durable":True,
                                  "schema_ready":True,
                                  "demo_seed_enabled":False,
                                  "demo_accounts":0,
                                  "ready":True,
                                  "production_ready":True,
                              }
                              bad={k:(ready.get(k),v) for k,v in required_ready.items() if ready.get(k)!=v}
                              if bad:
                                  raise SystemExit("PostgreSQL live readiness mismatch: "+repr(bad))
                              print("LIVE POSTGRES PROOF PASS: exact SHA, responsive UI and production readiness")
                          else:
                              raise SystemExit("Unsupported live backend: "+repr(backend))
                          sys.exit(0)
              except Exception as exc:
                  last=repr(exc)
                  print(f"attempt={attempt} error={exc!r}")
              time.sleep(10)
          raise SystemExit(f"Render did not reach exact expected SHA. Last response: {last}")
          PY
