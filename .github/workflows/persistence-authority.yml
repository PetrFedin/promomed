name: Promomed persistence authority

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run SQLite migration and persistence contract
        env:
          SQLITE_PATH: /tmp/promomed-phase0.sqlite
          PROMOMED_SEED_DEMO: "true"
        run: python -m unittest -v tests/test_persistence_contract.py
      - name: Prove SQLite backup and restore
        env:
          SQLITE_PATH: /tmp/promomed-phase0.sqlite
        run: |
          python ops/db_backup_restore.py backup --output /tmp/promomed-phase0-backup.sqlite
          python ops/db_backup_restore.py restore --input /tmp/promomed-phase0-backup.sqlite --sqlite-path /tmp/promomed-phase0-restored.sqlite
          SQLITE_PATH=/tmp/promomed-phase0-restored.sqlite PROMOMED_SEED_DEMO=false python - <<'PY'
          from app import db
          c=db.connect()
          assert c.execute("SELECT COUNT(*) n FROM program_items").fetchone()["n"] >= 42
          assert db.migration_status(c)["schema_ready"]
          c.close()
          print("SQLITE RESTORE PASS")
          PY

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promomed
          POSTGRES_PASSWORD: promomed
          POSTGRES_DB: promomed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promomed -d promomed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed
      PROMOMED_REQUIRE_POSTGRES: "true"
      PROMOMED_SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and PostgreSQL 17 client
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf "Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Run real PostgreSQL migration and API-state contract
        run: python -m unittest -v tests/test_persistence_contract.py
      - name: Prove PostgreSQL backup and restore
        env:
          PGPASSWORD: promomed
        run: |
          python ops/db_backup_restore.py backup --output /tmp/promomed-phase0.dump
          psql -h 127.0.0.1 -U promomed -d postgres -c "DROP DATABASE IF EXISTS promomed_restore;"
          psql -h 127.0.0.1 -U promomed -d postgres -c "CREATE DATABASE promomed_restore;"
          RESTORE_DATABASE_URL=postgresql://promomed:promomed@127.0.0.1:5432/promomed_restore python ops/db_backup_restore.py restore --input /tmp/promomed-phase0.dump
          DATABASE_URL=postgresql://promomed:promomed@127.0.0.1:5432/promomed_restore PROMOMED_REQUIRE_POSTGRES=true PROMOMED_SEED_DEMO=false python - <<'PY'
          from app import db
          c=db.connect()
          assert c.execute("SELECT COUNT(*) n FROM program_items").fetchone()["n"] >= 42
          assert c.execute("SELECT COUNT(*) n FROM auth_sessions").fetchone()["n"] >= 1
          status=db.migration_status(c)
          assert status["schema_ready"], status
          c.close()
          print("POSTGRES RESTORE PASS")
          PY

      - name: Prepare clean Phase 0 admission source and restore databases
        env:
          PGPASSWORD: promomed
        run: |
          psql -h 127.0.0.1 -U promomed -d postgres -c "DROP DATABASE IF EXISTS promomed_admission;"
          psql -h 127.0.0.1 -U promomed -d postgres -c "DROP DATABASE IF EXISTS promomed_admission_restore;"
          psql -h 127.0.0.1 -U promomed -d postgres -c "CREATE DATABASE promomed_admission;"
          psql -h 127.0.0.1 -U promomed -d postgres -c "CREATE DATABASE promomed_admission_restore;"

      - name: Admit clean source PostgreSQL
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission
          PROMOMED_REQUIRE_POSTGRES: "true"
          PROMOMED_SEED_DEMO: "false"
        run: python ops/phase0_postgres_admission.py

      - name: Generate ephemeral account test credentials
        run: |
          python - <<'PY'
          import secrets, os
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("CI_ACCOUNT_PASSWORD="+secrets.token_urlsafe(24)+"Aa1!\n")
              f.write("CI_ROTATED_PASSWORD="+secrets.token_urlsafe(24)+"Bb2!\n")
          PY

      - name: Reject demo identity provisioning
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission
          PROMOMED_REQUIRE_POSTGRES: "true"
          PROMOMED_SEED_DEMO: "false"
        run: |
          set +e
          PROMOMED_ACCOUNT_PASSWORD="$CI_ACCOUNT_PASSWORD" python ops/provision_account.py --email forbidden@demo.ru --role organizer --name "Forbidden Demo" > /tmp/demo-reject.json
          code=$?
          set -e
          test "$code" -ne 0
          python - <<'PY'
          import json
          result=json.load(open("/tmp/demo-reject.json"))
          assert result["error"]=="demo_identity_forbidden", result
          print("DEMO IDENTITY REJECTION PASS")
          PY

      - name: Prove production account bootstrap and rotation
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission
          PROMOMED_REQUIRE_POSTGRES: "true"
          PROMOMED_SEED_DEMO: "false"
        run: |
          PROMOMED_ACCOUNT_PASSWORD="$CI_ACCOUNT_PASSWORD" python ops/provision_account.py --email ci-organizer@example.test --role organizer --name "CI Organizer"
          python - <<'PY'
          import os
          from app import db
          from app.auth import authenticate, issue_session, token_hash
          c=db.connect()
          account=authenticate(c,"ci-organizer@example.test",os.environ["CI_ACCOUNT_PASSWORD"])
          assert account and account["role"]=="organizer", account
          token,_=issue_session(c,account["email"],account["role"],account["name"])
          row=c.execute("SELECT revoked_at FROM auth_sessions WHERE token_hash=?",(token_hash(token),)).fetchone()
          assert row and row["revoked_at"] is None
          c.close()
          with open("/tmp/ci-session-token-hash","w") as f:
              f.write(token_hash(token))
          print("ACCOUNT CREATE + LOGIN + SESSION PASS")
          PY
          PROMOMED_ACCOUNT_PASSWORD="$CI_ROTATED_PASSWORD" python ops/provision_account.py --email ci-organizer@example.test --role organizer --name "CI Organizer" --rotate
          python - <<'PY'
          import os
          from app import db
          from app.auth import authenticate
          token_hash_value=open("/tmp/ci-session-token-hash").read().strip()
          c=db.connect()
          assert authenticate(c,"ci-organizer@example.test",os.environ["CI_ACCOUNT_PASSWORD"]) is None
          account=authenticate(c,"ci-organizer@example.test",os.environ["CI_ROTATED_PASSWORD"])
          assert account and account["role"]=="organizer", account
          row=c.execute("SELECT revoked_at FROM auth_sessions WHERE token_hash=?",(token_hash_value,)).fetchone()
          assert row and row["revoked_at"] is not None, row
          c.close()
          print("ACCOUNT ROTATION + SESSION REVOCATION PASS")
          PY

      - name: Fingerprint clean source catalog
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission
          PROMOMED_SEED_DEMO: "false"
        run: python ops/db_catalog_fingerprint.py > /tmp/admission-source.json

      - name: Backup clean admitted source
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission
          PROMOMED_REQUIRE_POSTGRES: "true"
          PROMOMED_SEED_DEMO: "false"
        run: python ops/db_backup_restore.py backup --output /tmp/promomed-admission.dump

      - name: Restore clean admitted source
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission
          RESTORE_DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission_restore
          PROMOMED_REQUIRE_POSTGRES: "true"
          PROMOMED_SEED_DEMO: "false"
        run: python ops/db_backup_restore.py restore --input /tmp/promomed-admission.dump

      - name: Admit isolated restore PostgreSQL
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission_restore
          PROMOMED_REQUIRE_POSTGRES: "true"
          PROMOMED_SEED_DEMO: "false"
        run: python ops/phase0_postgres_admission.py

      - name: Fingerprint restored clean catalog
        env:
          DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_admission_restore
          PROMOMED_SEED_DEMO: "false"
        run: python ops/db_catalog_fingerprint.py > /tmp/admission-restore.json

      - name: Prove clean source and restore fingerprints match
        run: |
          python - <<'PY'
          import json
          source=json.load(open("/tmp/admission-source.json"))
          restored=json.load(open("/tmp/admission-restore.json"))
          assert source["catalog_sha256"] == restored["catalog_sha256"], (source, restored)
          assert source["counts"] == restored["counts"], (source, restored)
          assert source["migration_versions"] == restored["migration_versions"], (source, restored)
          print("CLEAN POSTGRES ADMISSION + RESTORE FINGERPRINT PASS")
          PY
