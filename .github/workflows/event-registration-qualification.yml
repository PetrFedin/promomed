name: Promomed event registration qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/p0-registration-transition-ledger-2026-10-16
      - fix/p0-event-admission-journey-2026-10-16
      - fix/p0-client365-crossmodule-lineage-2026-10-16
      - fix/p0-integrated-admission-evidence-2026-10-16
      - feat/portfolio-live-media-evidence-2026-10-18
      - fix/p0-portfolio-media-archive-integrity-2026-10-19
      - fix/p0-partner-binding-revocation-2026-10-20
      - fix/p0-commercial-write-atomicity-2026-10-20

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-event-registration:
    runs-on: ubuntu-latest
    env:
      SQLITE_PATH: /tmp/promomed-event-registration.db
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_REQUIRE_POSTGRES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Verify capacity, waitlist and admitted activity semantics on SQLite
        run: python -m unittest -v tests/test_event_registration.py tests/test_activity_booking_admission.py tests/test_client365_evidence.py

  postgres-event-registration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: promomed
          POSTGRES_PASSWORD: promomed
          POSTGRES_DB: promomed_event_registration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promomed -d promomed_event_registration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://promomed:promomed@127.0.0.1:5432/promomed_event_registration_ci
      PROMOMED_REQUIRE_POSTGRES: "true"
      PROMOMED_SEED_DEMO: "false"
      PROMOMED_EVENT_REGISTRATION_PG_TEST: "1"
      PROMOMED_ACTIVITY_BOOKING_PG_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Admit schema and prove guarded event provisioning
        run: |
          python - <<'PY'
          from app import db
          result=db.migrate()
          assert result["schema_ready"] and not result["checksum_drift"], result
          PY
          python ops/provision_event.py --id CI-EVENT --title "CI Event" --starts-at "2027-04-24T10:00:00+03:00" --capacity 2 --status open
          set +e
          python ops/provision_event.py --id CI-EVENT --title "CI Event" --starts-at "2027-04-24T10:00:00+03:00" --capacity 2 --status open >/tmp/duplicate-event.json
          code=$?
          set -e
          test "$code" -ne 0
          python - <<'PY'
          import json
          result=json.load(open("/tmp/duplicate-event.json"))
          assert result["error"]=="event_exists", result
          print("NON-DEMO EVENT PROVISIONING PASS")
          PY
      - name: Verify last-place serialization on PostgreSQL 17
        run: python -m unittest -v tests/test_event_registration_postgres.py tests/test_activity_booking_postgres.py
