services:
  - type: web
    name: sostoyanie-promomed
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m compileall -q server.py app
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SQLITE_PATH
        value: /tmp/sostoyanie.db
      - key: PROMOMED_DEMO_ACCOUNTS
        value: "1"
      # Production admission: inject DATABASE_URL from a dedicated PostgreSQL instance.
