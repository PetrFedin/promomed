services:
  - type: web
    name: sostoyanie-promomed
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m py_compile server.py app/db.py
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SQLITE_PATH
        value: /tmp/sostoyanie.db
